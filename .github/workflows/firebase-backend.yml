name: Deploy Meal Firebase backend (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy scope. Check live rules before deploying them."
        required: true
        type: choice
        default: functions
        options:
          - functions
          - storage
          - firestore
          - all
permissions:
  contents: read
  id-token: write
concurrency:
  group: meal-firebase-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials are configured
        env:
          WIF: ${{ vars.MEAL_FIREBASE_WIF_PROVIDER }}
          SA: ${{ vars.MEAL_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF" ] || [ -z "$SA" ]; then
            echo "::error::Firebase WIF identity is not configured. See docs/FIREBASE_CODEX_DEPLOY.md."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          project_id: mealplan-786a6
          workload_identity_provider: ${{ vars.MEAL_FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.MEAL_FIREBASE_SERVICE_ACCOUNT }}
      - name: Validate source
        run: |
          node --check functions/index.js
          node --check v2/recipes.js
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest
      - name: Deploy (only selected target)
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            functions) ONLY="functions:meal" ;;
            storage) ONLY="storage" ;;
            firestore) ONLY="firestore:rules" ;;
            all) ONLY="functions:meal,storage,firestore:rules" ;;
            *) echo "invalid target" >&2; exit 2 ;;
          esac
          firebase deploy --project mealplan-786a6 --only "$ONLY" --non-interactive
